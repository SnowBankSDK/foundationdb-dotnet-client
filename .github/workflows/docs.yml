name: Documentation

# Manual only: run this from the Actions tab whenever the docs are updated.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # SnowBank.DocGen renders mermaid diagrams to static SVG at build time via puppeteer-core, which
      # drives an installed Chrome (no chromium download). CHROME_PATH points the script at it.
      - uses: browser-actions/setup-chrome@v1
        id: chrome

      # The API reference is extracted by reflection from the built assemblies, so build the four the
      # docs cover (Release, net10.0). CopyLocalLockFileAssemblies puts their package deps next to them
      # so the reflection-only metadata load can resolve every referenced type.
      - name: Build API assemblies
        run: |
          for p in SnowBank.Core FoundationDB.Client FoundationDB.Aspire FoundationDB.Aspire.Hosting; do
            dotnet build "$p/$p.csproj" -c Release -f net10.0 -p:CopyLocalLockFileAssemblies=true
          done

      - name: Install doc-tool node deps (mermaid + Shiki)
        run: npm ci
        working-directory: SnowBank.DocGen/tools

      # Reads Documentation/, renders the static site (guides + API reference + French) to artifacts/_site.
      - name: Generate docs
        run: dotnet run --project SnowBank.DocGen/SnowBank.DocGen.csproj -c Release
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/_site
      - id: deployment
        uses: actions/deploy-pages@v4
